name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: dart run scripts/check_licenses.dart

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug --dart-define-from-file=config/development.json

  build-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      # iOS and macOS share one job to conserve macOS runner minutes,
      # which bill at a 10x multiplier on private repositories.
      - run: flutter build ios --debug --no-codesign --dart-define-from-file=config/development.json
      - run: flutter build macos --debug --dart-define-from-file=config/development.json

  # The ONLY Windows verification this project will ever receive.
  # If this fails after pdfrx or drift is added, suspect Dart native assets first.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --debug --dart-define-from-file=config/development.json
